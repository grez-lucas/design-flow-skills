name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests de revisar.py
        run: python3 -m unittest discover -s tests/checklist-diseno -v
      - name: Tests de los grade.py
        run: python3 -m unittest discover -s tests/pruebas -v
      - name: Tests del repositorio
        run: python3 -m unittest discover -s tests/repositorio -v
      - name: Tests de proto.js en Chrome
        run: python3 -m unittest discover -s tests/spec-a-html -v

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.311
      - name: Validar plugin y marketplace
        run: claude plugin validate .
