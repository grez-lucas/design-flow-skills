<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Huerta · React</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function App() {
  const [escenario, setEscenario] = React.useState('normal');
  return (<div className="p-4 text-red-600">
    <select onChange={e => setEscenario(e.target.value)}><option>Simular plan vencido</option></select>
    <h1>Panel de la huerta</h1>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
