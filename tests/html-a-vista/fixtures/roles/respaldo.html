<title>Prueba · var() con respaldo</title>
<style>
:root { --borde: #dddddd; --a: #111111; --b: #222222; --fondo-x: #abcdef; }

.x { background: var(--nada, var(--tampoco, var(--fondo-x))); }

</head>
<body><div class="card x y">Texto</div></body>
